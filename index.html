<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Spotify Player - TV Girl</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    .spotify-player {
      background-color: #181818;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 350px;
    }

    .spotify-player iframe {
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    h2 {
      color: #fff;
      margin-bottom: 15px;
      font-size: 1.5em;
    }

    .track-info {
      color: #b3b3b3;
      font-size: 0.9em;
      margin-top: 10px;
      text-align: center;
    }

  </style>
</head>
<body>

  <div class="spotify-player">
    <h2>Taking What's Not Yours</h2>
    <iframe src="https://open.spotify.com/embed/track/1yTQxPYZZBEuPgybUlD8dF" width="300" height="80" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    <div class="track-info">
      <p>TV Girl</p>
    </div>
  </div>

</body>
</html>
