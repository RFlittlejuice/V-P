<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>You Know Where to Find Me</title>
  <!-- Usando uma fonte mais elegante e sombria, mas moderna -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
      font-family: 'Cinzel', serif;
      overflow: hidden;
      background: url('https://i.imgur.com/AtdxlJ6.png') no-repeat center center fixed;
      background-size: cover;
    }

    h1 {
      font-size: 4.5em;
      color: transparent;
      background: linear-gradient(45deg, #00ffff, #ff69b4);
      -webkit-background-clip: text;
      text-align: center;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3), 0 0 20px rgba(255, 255, 255, 0.5);
      animation: glow 3s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px #00ffff, 0 0 20px #ff69b4;
      }
      to {
        text-shadow: 0 0 20px #ff69b4, 0 0 30px #00ffff;
      }
    }

    .spotify-embed {
      margin-top: 40px;
      border-radius: 12px;
      box-shadow: 0 0 15px #ff69b4;
    }

    .background-effect {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      pointer-events: none;
      animation: fogEffect 6s infinite alternate;
    }

    @keyframes fogEffect {
      0% {
        opacity: 0.6;
      }
      100% {
        opacity: 0.8;
      }
    }
  </style>
</head>
<body>
  <!-- Efeito de fundo -->
  <div class="background-effect"></div>
  
  <h1>You know where to find me</h1>

  <!-- Player do Spotify -->
  <iframe class="spotify-embed" src="https://open.spotify.com/embed/track/1yTQxPYZZBEuPgybUlD8dF?utm_source=generator" width="300" height="80" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>

</body>
</html>
