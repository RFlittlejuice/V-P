<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>You Know Where to Find Me</title>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      font-family: 'UnifrakturCook', cursive;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      overflow: hidden;
    }

    h1 {
      font-size: 4em;
      text-align: center;
      background: linear-gradient(45deg, #00ffff, #ff69b4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
      animation: glow 3s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px #00ffff, 0 0 20px #ff69b4;
      }
      to {
        text-shadow: 0 0 20px #ff69b4, 0 0 30px #00ffff;
      }
    }

    .spotify-embed {
      margin-top: 40px;
      border-radius: 12px;
      box-shadow: 0 0 15px #ff69b4;
    }
  </style>
</head>
<body>
  <h1>You know where to find me</h1>

  <!-- Substitua o link abaixo pelo link da música correta -->
  <iframe class="spotify-embed" style="border-radius:12px" src="https://open.spotify.com/embed/track/1yTQxPYZZBEuPgybUlD8dF?utm_source=generator" width="300" height="80" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>

</body>
</html>
